[package]
name = "vox-desktop-control"
version = "0.1.0"
edition = "2021"
description = "Local GUI control (app launch, AX-based click) for the Vox desktop remote-control channel"

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.24"
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSError", "NSDictionary", "NSString", "NSValue"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGDataProvider", "CGColorSpace", "CGGeometry"] }
objc2-core-foundation = { version = "0.3", features = ["CFData", "CFCGTypes"] }
image = { version = "0.25", default-features = false }
xcap = "0.9"
